name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri dependencies (macOS)
        run: |
          brew install gtk+3 librsvg
          # Tauri's macOS dependencies are mostly preinstalled on the runner

      - name: Build Tauri app
        run: cargo tauri build --verbose

      - name: Zip .app bundle
        run: |
          cd src-tauri/target/release/bundle/macos/
          zip -r "Transcript-Extractor.zip" "Transcript Extractor.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Transcript-Extractor
          path: src-tauri/target/release/bundle/macos/Transcript-Extractor.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/macos/Transcript-Extractor.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
